<style>
/* Yazı tipleri Pi'den sunulur; internet gerekmez */
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(/fonts/barlow-condensed-latin-ext-700-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(/fonts/barlow-condensed-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-ext-600-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

<style>
/* Düzen: geniş ekranda (Pi ekranı, bilgisayar) solda menü + sağda içerik; telefonda üstte başlık, altta sekme çubuğu.
   Renkler Amasya Üniversitesi logosundan: kırmızı #e42317, yeşil #009640, gri #9d9d9c, siyah #1d1d1b */
:root{
  --bg:#f3f3f1; --surface:#ffffff; --surface-2:#f6f6f5; --line:#dcdcda;
  --fg:#1d1d1b; --muted:#666664; --accent:#e42317; --accent-fg:#ffffff; --logo-gri:#9d9d9c;
  --ok:#009640; --ok-bg:#e1f2e7; --warn:#9a6500; --warn-bg:#fbf0d9; --bad:#b5170e; --bad-bg:#fbe3e1; --run:#ffffff; --run-bg:#1d1d1b;
  --scrim:rgba(29,29,27,.5); --accent-bg:#fde8e6; --hero-1:#e42317; --hero-2:#a3150d;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --surface:#1e1e1d; --surface-2:#262625; --line:#393937;
  --fg:#f1f1ef; --muted:#a3a3a0; --accent:#f0473c; --accent-fg:#ffffff; --logo-gri:#9d9d9c;
  --ok:#3dbb72; --ok-bg:#13301f; --warn:#e7b04e; --warn-bg:#3a2f17; --bad:#ff7a70; --bad-bg:#3a1714; --run:#141413; --run-bg:#f1f1ef;
  --scrim:rgba(0,0,0,.6); --accent-bg:#3a1714; --hero-1:#c81f14; --hero-2:#7d120b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1e1e1d; --surface-2:#262625; --line:#393937;
  --fg:#f1f1ef; --muted:#a3a3a0; --accent:#f0473c; --accent-fg:#ffffff; --logo-gri:#9d9d9c;
  --ok:#3dbb72; --ok-bg:#13301f; --warn:#e7b04e; --warn-bg:#3a2f17; --bad:#ff7a70; --bad-bg:#3a1714; --run:#141413; --run-bg:#f1f1ef;
  --scrim:rgba(0,0,0,.6); --accent-bg:#3a1714; --hero-1:#c81f14; --hero-2:#7d120b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px solid var(--accent);box-shadow:0 2px 0 0 var(--ok);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px}
.logo{height:52px;width:52px;max-width:72px;object-fit:contain;flex:none}
.brand .kurum{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:.02em;text-transform:none;color:var(--fg);margin-bottom:4px;line-height:1.25}
.sayfa{display:none;flex:1;min-width:0}
.sayfa h1{font-family:var(--f-display);font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.05;text-wrap:balance}
.sayfa p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}

main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:22px;min-width:0}

/* Menü: telefonda alt çubuk */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr) 64px;gap:4px;align-items:center}
.yan-marka,.yan-alt,.fab .etiket{display:none}
.tab{order:1;background:none;border:0;padding:6px 4px;border-radius:8px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px;flex:none}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--accent)}
.fab{order:4;width:56px;height:56px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;cursor:pointer;justify-self:center}
.fab svg{width:26px;height:26px}
.fab:disabled{opacity:.4}

/* Menü: geniş ekranda sol kenar */
@media (min-width:900px){
  body:not(.kilitli){padding-left:236px}
  body:not(.kilitli) header.top .logo,body:not(.kilitli) header.top .brand{display:none}
  body:not(.kilitli) .sayfa{display:block}
  header.top{padding-block:14px}
  nav.tabs{top:0;bottom:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);overflow-y:auto;
    padding:22px 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
  nav.tabs::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--accent) 0 72%,var(--ok) 72%)}
  .tabs-in{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-height:100%;max-width:none}
  .yan-marka{order:0;display:grid;gap:8px;justify-items:start;padding:0 6px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .yan-marka img{width:60px;height:60px;object-fit:contain}
  .yan-marka b{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
  .yan-marka span{font-size:12px;color:var(--muted);line-height:1.4}
  .fab{order:1;width:100%;height:auto;padding:12px 14px;border-radius:10px;display:flex;align-items:center;gap:8px;justify-content:center;font-weight:600;margin-bottom:14px}
  .fab svg{width:20px;height:20px}
  .fab .etiket{display:inline}
  .tab{order:2;display:flex;align-items:center;gap:12px;padding:11px 12px;font-size:15px;border-radius:10px}
  .tab:hover{background:var(--surface-2)}
  .tab[aria-current="page"]{background:var(--accent-bg);color:var(--accent)}
  .yan-alt{order:3;display:grid;gap:2px;margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-align:left;cursor:pointer;font:inherit;color:inherit}
  .yan-alt b{font-size:14px;overflow-wrap:anywhere}
  .yan-alt span{font-size:12px;color:var(--muted)}
  main{padding-block:24px 32px}
  .sayfa-ici{display:none}
}

h2.sec{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--fg);text-wrap:balance}
h2.sec small{font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted);margin-left:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.bolum{display:grid;gap:12px;min-width:0}
.bolum-bas{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;min-height:32px}
.kart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.izgara{display:grid;gap:22px;min-width:0}
.sutun{display:grid;gap:22px;min-width:0;align-content:start}
@media (min-width:900px){.izgara.iki{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Karşılama bandı */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--hero-1),var(--hero-2));
  padding:22px 20px 46px;display:grid;gap:16px}
.hero .kemer{position:absolute;right:-28px;top:-18px;width:210px;height:auto;opacity:.13;z-index:-1}
.hero .dalga,.giris-tanitim .dalga{position:absolute;left:0;right:0;bottom:0;width:100%;height:34px;z-index:-1}
.hero-ust{font-size:13px;font-weight:500;opacity:.88}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;margin:6px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.hero p{margin:8px 0 0;max-width:56ch;opacity:.94}
.hero-sayilar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hs{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:12px;padding:10px 12px;min-width:0}
.hs .l{font-size:12px;opacity:.88}
.hs .v{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (min-width:760px){.hero{grid-template-columns:minmax(0,1fr) auto;align-items:end;padding:30px 30px 54px}.hero h1{font-size:44px}.hero-sayilar{grid-template-columns:repeat(3,112px)}}

/* Sayı kartları */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpis.uc{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;display:grid;gap:4px;align-content:start}
.kpi .ik{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg);margin-bottom:6px}
.kpi .ik svg{width:20px;height:20px}
.kpi .ik.kirmizi{background:var(--accent-bg);color:var(--accent)}
.kpi .ik.yesil{background:var(--ok-bg);color:var(--ok)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(16px,4.4vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:13px;color:var(--muted)}
.kpi .v.save{color:var(--ok)}
.kpi .v.zarar{color:var(--bad)}
.kpi .alt{font-size:12px;color:var(--muted)}
.kpi .alt.art{color:var(--ok)}
.kpi .alt.az{color:var(--bad)}
.kpi .alt span{color:var(--muted)}

/* Listeler */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;min-width:0;color:inherit;font:inherit}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .r{text-align:right;flex:none}
.cipler{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cip i{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-2);border:1px solid var(--line)}
.thumb.ph{display:grid;place-items:center;color:var(--muted)}
.thumb.ph svg{width:22px;height:22px}

.swatch{width:36px;height:36px;border-radius:50%;flex:none;border:2px solid var(--line);position:relative}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.low{background:var(--bad)}
.bar i.mid{background:var(--warn)}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-sira{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.p-baski{background:var(--run-bg);color:var(--run)}
.p-tamam{background:var(--ok-bg);color:var(--ok)}
.p-hata{background:var(--bad-bg);color:var(--bad)}
.p-kritik{background:var(--bad-bg);color:var(--bad)}

/* Yazıcı kartları */
.printers{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.prn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;display:grid;gap:10px;align-content:start}
.prn-ust{display:flex;gap:10px;align-items:center;min-width:0}
.prn-ik{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--fg)}
.prn-ik svg{width:22px;height:22px}
.prn.busy{border-color:var(--fg)}
.prn.busy .prn-ik{background:var(--run-bg);color:var(--run)}
.prn .n{font-weight:600;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.prn .durum{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.prn .durum i{width:8px;height:8px;border-radius:50%;background:var(--logo-gri)}
.prn.busy .durum{color:var(--fg);font-weight:600}
.prn .canli{margin-left:4px;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--ok);border:1px solid currentColor;border-radius:4px;padding:0 4px}
.prn.hatali{border-color:var(--bad)}.prn.hatali .durum{color:var(--bad)}
.prn.busy .durum i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.prn .is{border:0;background:none;padding:0;text-align:left;font-weight:600;cursor:pointer;font-size:14px;color:inherit;overflow-wrap:anywhere}
.prn .is:hover{text-decoration:underline}
.ilerleme{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.ilerleme i{display:block;height:100%;background:var(--fg);border-radius:3px}
.prn .kalan{font-size:12px;color:var(--muted)}

/* Grafikler */
.grafik svg{display:block;width:100%;height:auto}
.grafik .ek{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.grafik .dg{fill:var(--fg);font-size:12px;font-family:var(--f-mono)}
.grafik .cubuk{fill:var(--ok);opacity:.45}
.grafik .cubuk.son{opacity:1}
.grafik .cizgi{stroke:var(--line);stroke-width:1}
.hbar{display:grid;gap:12px}
.hbar-s{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar-s .iz{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}

.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;

(function(){
"use strict";
const VARSAYILAN_YAZICILAR=["Bambu Lab H2S Combo","Bambu Lab H2D Combo","Bambu Lab H2D Combo + 40 W Lazer","Phrozen Sonic Mega 8K V2"];

  tab:"panel",donem:"ay",filtre:"aktif",q:"",stokQ:"",names:{},downloads:null};

const $=s=>document.querySelector(s);
const app=$("#app"), layer=$("#layer");
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf0=new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0});

const nf2=new Intl.NumberFormat("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const gr=n=>{n=+n||0;return Math.abs(n)>=1000? nf2.format(n/1000)+" kg" : nf0.format(n)+" g"};
const tl=n=>nf2.format(+n||0)+" ₺";
const num=v=>{if(v==null||v==="")return null;const x=parseFloat(String(v).replace(/\./g,"").replace(",","."));return isFinite(x)?x:null};
const numIn=v=>{if(v==null||v==="")return null;const s=String(v).trim();const x=s.includes(",")?parseFloat(s.replace(/\./g,"").replace(",",".")):parseFloat(s);return isFinite(x)?x:null};
const tarih=t=>t?new Date(t).toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"}):"—";
const saat=t=>t?new Date(t).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const sure=h=>{h=+h||0;const top=Math.round(h*60),H=Math.floor(top/60),M=top%60;return (H?H+" sa ":"")+(M||!H?M+" dk":"")};
const yazicilar=()=>(S.ayar&&Array.isArray(S.ayar.yazicilar)&&S.ayar.yazicilar.length)?S.ayar.yazicilar:VARSAYILAN_YAZICILAR;

const kimlikGecerli=()=>!!(S.kimlik&&Date.now()-S.kimlik.t<KIMLIK_SURE);
const _sv=(d,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.9}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

const KEMER='<svg class="kemer" viewBox="0 0 200 210" aria-hidden="true"><path d="M24 210V96a76 76 0 0 1 152 0v114" fill="none" stroke="#fff" stroke-width="30"/><path d="M72 210V100a28 28 0 0 1 56 0v110" fill="none" stroke="#fff" stroke-width="12"/></svg>';

const telGoster=t=>{t=String(t||"").replace(/\D/g,"");if(t.length===10)t="0"+t;
  return t.replace(/^(\d)(\d{3})(\d{0,3})(\d{0,2})(\d{0,2}).*$/,(m,a,b,c,d,e)=>[a+b,c,d,e].filter(Boolean).join(" "))};

/* ---------- Pi sunucusu bağlantısı ---------- */
async function API(m,u,b,ham,tekrar){
  let r;const bas=ham?{"Content-Type":"image/jpeg"}:(b!==undefined?{"Content-Type":"application/json"}:{});
  const yazma=m!=="GET"&&m!=="HEAD";
  if(yazma&&S.misafir&&kimlikGecerli()){bas["X-Telefon"]=S.kimlik.tel;S.kimlik.t=Date.now()}
  try{r=await fetch(u,{method:m,cache:"no-store",headers:bas,
    body:ham?b:(b!==undefined?JSON.stringify(b):undefined)})}
  catch(e){throw {code:"ag"}}
  if(!r.ok){let h={};try{h=await r.json()}catch(_){}
    /* Girişsiz kullanımda değişiklik: telefon numarası sor, doğrulanınca aynı isteği yinele */
    if(r.status===401&&h.hata==="kimlik"&&S.misafir&&!tekrar){
      S.kimlik=null;
      if(await kimlikSor())return API(m,u,b,ham,true);
      throw {code:"iptal"}}
    if(r.status===401&&h.hata==="oturum"&&S.ben&&!S.misafir){girisGoster(false);toast("Yönetici oturumu kapandı")}
    throw {code:h.hata||("http_"+r.status),saniye:h.saniye}}
  return r.json();
}
/* Telefon numarası sorma penceresi: açık formların üstünde ayrı katmanda durur, formu bozmaz */
let _kimlikBekleyen=null;
function kimlikSor(){
  if(_kimlikBekleyen)return _kimlikBekleyen;
  _kimlikBekleyen=new Promise(coz=>{
    const k=document.createElement("div");k.className="kimlik-katman";k.setAttribute("role","dialog");k.setAttribute("aria-modal","true");
    document.body.appendChild(k);
    let tel="",hata="",mesgul=false;
    const bitir=sonuc=>{k.remove();document.removeEventListener("keydown",tus,true);_kimlikBekleyen=null;coz(sonuc)};
    const ciz=()=>{const ok=/^5\d{9}$/.test(tel);
      k.innerHTML=`<div class="kimlik-kutu"><h3>Kim değiştiriyor?</h3>
      <p>Kayıtlı cep telefonu numaranızı girin. Yaptığınız değişiklik bu numaranın sahibi adına kaydedilir.</p>
      <div class="ekran etkin ${tel?"":"bos"}">${tel?esc(telGoster(tel)):"5xx xxx xx xx"}</div>
      <div class="err" role="alert">${hata?esc(hata):""}</div>
      <div class="tus">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
        <button class="geri" data-k="sil" aria-label="Sil">⌫</button><button data-k="0">0</button>
        <button class="ok" data-k="ok" ${ok&&!mesgul?"":"disabled"}>${mesgul?"…":"Onayla"}</button></div>
      <button class="btn sm" data-k="iptal" style="margin-top:10px;width:100%">Vazgeç</button></div>`};
    const bas=async t=>{
      if(mesgul)return;
      if(t==="iptal")return bitir(false);
      if(t==="sil"){tel=tel.slice(0,-1);hata="";return ciz()}
      if(t==="ok"){if(!/^5\d{9}$/.test(tel))return;
        mesgul=true;ciz();
        try{const r=await fetch("/api/kimlik",{method:"POST",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({telefon:tel})});
          const h=await r.json().catch(()=>({}));mesgul=false;
          if(r.ok){S.kimlik={tel,ad:h.ad,t:Date.now()};setSync(true,"Bağlı · "+h.ad.split(" ")[0]);toast(h.ad+" olarak kaydediliyor");return bitir(true)}
          hata=h.hata==="kilitli"?`Çok fazla hatalı deneme. ${Math.ceil((h.saniye||300)/60)} dakika sonra tekrar deneyin.`:
               h.hata==="kimlik"?"Bu numara kayıtlı değil ya da değişiklik yetkisi yok.":"Doğrulanamadı, tekrar deneyin.";
          tel=""}
        catch(e){mesgul=false;hata="Pi'ye ulaşılamadı."}
        return ciz()}
      if(/^\d$/.test(t)&&tel.length<10){if(!tel&&t==="0")return;tel+=t;hata="";ciz()}
    };
    const tus=e=>{if(/^\d$/.test(e.key))bas(e.key);else if(e.key==="Backspace")bas("sil");else if(e.key==="Enter")bas("ok");else if(e.key==="Escape")bas("iptal");else return;
      e.preventDefault();e.stopPropagation()};
    k.onclick=e=>{const b=e.target.closest("[data-k]");if(b)bas(b.dataset.k);else if(e.target===k)bas("iptal")};
    document.addEventListener("keydown",tus,true);
    ciz();
  });
  return _kimlikBekleyen;
}
const yeniId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function ref(kol,id){
  const u="/api/belge/"+kol+"/"+encodeURIComponent(id);
  return {id,

    set:async d=>{await API("PUT",u,d);yenile()},
    update:async d=>{await API("PATCH",u,d);yenile()},
    delete:async()=>{await API("DELETE",u);yenile()}};
}
const DB={doc(p){const [k,i]=p.split("/");return ref(k,i)},collection(k){return {doc:i=>ref(k,i||yeniId())}}};
const ASSETS={upload:b=>API("POST","/api/foto",b,true),delete:id=>API("DELETE","/api/foto/"+id)};
const DOWNLOADS={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=filename;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
const stokAd=s=>s?[s.marka,s.malzeme,s.renk].filter(Boolean).join(" · "):"Silinmiş malzeme";

function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function setSync(on,txt){$("#syncDot").classList.toggle("on",on);$("#syncTxt").textContent=txt}

function maliyetHesap(j){const g=j.durum==="tamam"||j.durum==="hata"?(+j.gercekGr||0):(+j.tahminiGr||0);return g*((+j.birimFiyatKg||0)/1000)}
function piyasa(j){return (+j.piyasaBirim||0)*(+j.adet||1)}
function tasarruf(j){return j.durum==="tamam"&&j.piyasaBirim?piyasa(j)-maliyetHesap(j):0}
function donemBaslangic(){const d=new Date();if(S.donem==="ay")return new Date(d.getFullYear(),d.getMonth(),1);
  if(S.donem==="ceyrek")return new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1);return new Date(d.getFullYear(),0,1)}
function donemAd(){const d=new Date();if(S.donem==="ay")return d.toLocaleDateString("tr-TR",{month:"long",year:"numeric"});
  if(S.donem==="ceyrek")return d.getFullYear()+" "+(Math.floor(d.getMonth()/3)+1)+". çeyrek";return d.getFullYear()+" yılı"}
function kritikMi(s){return (+s.kalanGr||0)<=(+s.kritikGr||200)}

/* ---------- Görünümler ---------- */
function render(){
  const ae=document.activeElement,odak=ae&&(ae.id==="q"||ae.id==="sq")?{id:ae.id,p:ae.selectionStart}:null;
  ciz();
  if(odak){const n=document.getElementById(odak.id);if(n){n.focus();try{n.setSelectionRange(odak.p,odak.p)}catch(_){}}}

function ciz(){
  if(!S.ben)return;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
  $("#fab").disabled=!S.canWrite||!S.db;

  const ro=S.canWrite?"":`<div class="ro">Bu sayfada yalnızca görüntüleme yetkiniz var; kayıt ekleyemez ve değiştiremezsiniz.</div>`;
  $("#sayfaBaslik").textContent=SAYFA[S.tab][0];$("#sayfaAlt").textContent=SAYFA[S.tab][1];
  $("#yanKisi").innerHTML=S.misafir?`<b>${kimlikGecerli()?esc(S.kimlik.ad):"Ortak kullanım"}</b><span>Hesap ve sistem</span>`:`<b>${esc(S.ben.ad)}</b><span>${ROL_AD[S.ben.rol]} · Hesap ve sistem</span>`;
  if(S.tab==="panel")app.innerHTML=ro+panelHTML()+altBilgi();
  else if(S.tab==="uretim")app.innerHTML=ro+uretimHTML()+altBilgi();
  else app.innerHTML=ro+stokHTML()+altBilgi();
}

function donemAralik(kayma){
  const d=new Date();let a,b;
  if(S.donem==="ay"){a=new Date(d.getFullYear(),d.getMonth()+kayma,1);b=new Date(d.getFullYear(),d.getMonth()+kayma+1,1)}
  else if(S.donem==="ceyrek"){const q=Math.floor(d.getMonth()/3)*3;a=new Date(d.getFullYear(),q+3*kayma,1);b=new Date(d.getFullYear(),q+3*kayma+3,1)}
  else{a=new Date(d.getFullYear()+kayma,0,1);b=new Date(d.getFullYear()+kayma+1,0,1)}
  return [a.getTime(),b.getTime()];
}
function donemOzet(kayma){
  const [a,b]=donemAralik(kayma);
  const L=S.isler.filter(j=>(j.durum==="tamam"||j.durum==="hata")&&(j.bitis||0)>=a&&(j.bitis||0)<b);
  const T=L.filter(j=>j.durum==="tamam");
  return {is:T.length,adet:T.reduce((x,j)=>x+(+j.adet||1),0),gr:L.reduce((x,j)=>x+(+j.gercekGr||0),0),
    mal:L.reduce((x,j)=>x+maliyetHesap(j),0),tas:T.reduce((x,j)=>x+tasarruf(j),0),L};
}
const ONCEKI={ay:"geçen aya",ceyrek:"önceki çeyreğe",yil:"geçen yıla"};
function degisim(simdi,once,renkli){
  if(!once)return `<div class="alt">${simdi?"Önceki dönemde kayıt yok":"Bu dönemde henüz kayıt yok"}</div>`;
  const y=Math.round((simdi-once)/Math.abs(once)*100);
  const sinif=renkli?(y>=0?"art":"az"):"";
  return `<div class="alt ${sinif}">${y>=0?"▲":"▼"} %${nf0.format(Math.abs(y))} <span>${ONCEKI[S.donem]} göre</span></div>`;
}
const kisaSayi=v=>Math.abs(v)>=1e6?nf1.format(v/1e6)+" mn":Math.abs(v)>=1e3?nf1.format(v/1e3)+" bin":nf0.format(v);
function aylikGrafik(){
  const d=new Date(),aylar=[];
  for(let i=5;i>=0;i--){
    const a=new Date(d.getFullYear(),d.getMonth()-i,1).getTime(),b=new Date(d.getFullYear(),d.getMonth()-i+1,1).getTime();
    const T=S.isler.filter(j=>j.durum==="tamam"&&(j.bitis||0)>=a&&(j.bitis||0)<b);
    aylar.push({ad:new Date(a).toLocaleDateString("tr-TR",{month:"short"}),tas:T.reduce((x,j)=>x+tasarruf(j),0)});
  }
  const max=Math.max(...aylar.map(a=>a.tas),0);
  if(max<=0)return `<div class="empty" style="border:0;padding:24px 8px">Son 6 ayda piyasa fiyatı girilmiş tamamlanan iş yok. İş kaydında piyasa fiyatı girilirse tasarruf burada ay ay görünür.</div>`;
  const W=600,H=210,ust=26,alt=30,gen=W/6,bw=Math.min(58,gen*.56),y=v=>ust+(H-ust-alt)*(1-v/max);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Son 6 ayın aylık tasarrufu">
    <line class="cizgi" x1="0" x2="${W}" y1="${H-alt}" y2="${H-alt}"/>
    ${aylar.map((a,i)=>{const x=gen*i+(gen-bw)/2,v=Math.max(a.tas,0),yy=y(v),h=Math.max(H-alt-yy,v>0?3:0);
      return `<rect class="cubuk ${i===5?"son":""}" x="${x.toFixed(1)}" y="${(H-alt-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="5"/>
      ${v>0?`<text class="dg" x="${(x+bw/2).toFixed(1)}" y="${(H-alt-h-8).toFixed(1)}" text-anchor="middle">${kisaSayi(v)} ₺</text>`:""}
      <text class="ek" x="${(x+bw/2).toFixed(1)}" y="${H-9}" text-anchor="middle">${esc(a.ad)}</text>`}).join("")}</svg>`;
}
function malzemeDagilim(L){
  const m={};L.forEach(j=>{const s=stokBul(j.stokId);const k=s?s.malzeme:"Diğer";m[k]=(m[k]||0)+(+j.gercekGr||0)});
  const E=Object.entries(m).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
  if(!E.length)return `<div class="empty" style="border:0;padding:16px 8px">Bu dönemde malzeme harcanmadı.</div>`;
  return `<div class="hbar">${E.map(([k,v])=>`<div class="hbar-s"><span>${esc(k)}</span><span class="iz"><i style="width:${(v/E[0][1]*100).toFixed(1)}%"></i></span><span class="num">${gr(v)}</span></div>`).join("")}</div>`;
}
const BAMBU_DURUM={RUNNING:"Baskıda",PREPARE:"Hazırlanıyor",SLICING:"Hazırlanıyor",PAUSE:"Duraklatıldı",FINISH:"Bitti",FAILED:"Hata verdi",IDLE:"Boşta"};
const bambuCanli=p=>S.bambu&&(S.bambu.yazicilar||[]).find(x=>x.yazici===p&&x.bagli&&x.durum);
function yaziciKart(p,j){
  const b=bambuCanli(p);
  if(b){
    const calisiyor=["RUNNING","PREPARE","SLICING","PAUSE"].includes(b.durum),y=Math.max(0,Math.min(100,+b.yuzde||0));
    const alt=[b.kalanDk>0&&calisiyor?sure(b.kalanDk/60)+" kaldı":"",b.toplamKatman?`katman ${b.katman||0}/${b.toplamKatman}`:""].filter(Boolean).join(" · ");
    return `<div class="prn ${calisiyor?"busy":""} ${b.durum==="FAILED"?"hatali":""}"><div class="prn-ust"><span class="prn-ik">${IK.yazici}</span><div style="min-width:0"><div class="n">${esc(p)}</div>
      <div class="durum"><i></i>${BAMBU_DURUM[b.durum]||esc(b.durum)}${calisiyor||b.durum==="FINISH"?` · %${y}`:""}<span class="canli">CANLI</span></div></div></div>
      ${j?`<button class="is" data-act="is" data-id="${j.id}">${esc(j.ad)}</button>`:b.is&&b.durum!=="IDLE"?`<div class="kalan" style="color:var(--fg);font-weight:600;overflow-wrap:anywhere">${esc(b.is)}</div>`:""}
      ${calisiyor||b.durum==="FINISH"?`<div class="ilerleme" role="progressbar" aria-valuenow="${y}" aria-valuemin="0" aria-valuemax="100"><i style="width:${y}%"></i></div>`:""}
      <div class="kalan">${alt||(j?"":"Yeni iş başlatılabilir")}</div></div>`}
  let ek="";
  if(j&&j.baslangic&&j.tahminiSure){const top=j.tahminiSure*3600000,gec=Date.now()-j.baslangic,o=Math.max(0,Math.min(1,gec/top)),kal=top-gec;
    ek=`<div class="ilerleme" role="progressbar" aria-valuenow="${Math.round(o*100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${(o*100).toFixed(1)}%"></i></div>
      <div class="kalan">${kal>60000?"Tahmini kalan "+sure(kal/3600000):"Tahmini süre doldu"}</div>`}

function isSatir(j){

  const g=j.durum==="tamam"||j.durum==="hata"?(j.gercekGr||0):(j.tahminiGr||0);
  const zaman=j.durum==="sira"?"Eklendi "+tarih(j.olusturma):j.durum==="baski"?"Başladı "+saat(j.baslangic):"Bitti "+tarih(j.bitis);
  return `<button class="item" data-act="is" data-id="${j.id}">${th}
    <div class="body"><div class="t">${esc(j.ad)}${(+j.adet||1)>1?` <span class="num" style="color:var(--muted);font-weight:500">×${nf0.format(j.adet)}</span>`:""}</div>
    <div class="s">${zaman}${j.birim?" · "+esc(j.birim):""}</div>
    <div class="cipler"><span class="cip">${esc(j.yazici||"Yazıcı seçilmedi")}</span>${s?`<span class="cip"><i style="background:${esc(s.renkHex||"#888888")}"></i>${esc(s.malzeme)}${s.renk?" "+esc(s.renk):""}</span>`:""}</div></div>
    <div class="r"><span class="pill ${pillCls(j.durum)}">${DURUMLAR[j.durum]||"—"}</span><div class="num" style="font-size:13px;margin-top:6px">${gr(g)}</div></div></button>`;
}
function pillCls(d){return {sira:"p-sira",baski:"p-baski",tamam:"p-tamam",hata:"p-hata"}[d]||"p-sira"}

function uretimHTML(){

function stokSatir(s){
  const k=+s.kalanGr||0,b=Math.max(+s.baslangicGr||1000,k,1),p=Math.max(0,Math.min(100,k/b*100));
  const kr=kritikMi(s);

    <span class="swatch" style="background:${esc(s.renkHex||"#888888")}"></span>
    <div class="body"><div class="t">${esc(s.malzeme)} · ${esc(s.renk||"Renk yok")}</div>
    <div class="s">${esc(s.marka||"Marka yok")}${s.cap?" · "+esc(s.cap):""} · ${tl(s.birimFiyatKg)}/kg</div>
    <div class="bar"><i class="${kr?"low":p<40?"mid":""}" style="width:${p}%"></i></div></div>
    <div class="r"><div class="num">${gr(k)}</div>${kr?`<span class="pill p-kritik" style="margin-top:4px">Kritik</span>`:""}</div></button>`;
}
function makaraKart(s){
  const k=+s.kalanGr||0,b=Math.max(+s.baslangicGr||1000,k,1),p=Math.max(0,Math.min(100,k/b*100)),kr=kritikMi(s);
  const renk=kr?"var(--bad)":p<40?"var(--warn)":"var(--ok)";
  return `<button class="makara" data-act="stok" data-id="${s.id}">
    <span class="halka" style="--p:${p.toFixed(1)};--c:${renk}"><span class="ic" style="background:${esc(s.renkHex||"#888888")}"></span></span>
    <span class="mb"><span class="t">${esc(s.malzeme)} · ${esc(s.renk||"Renk yok")}</span>
      <span class="s">${esc(s.marka||"Marka yok")}${s.cap?" · "+esc(s.cap):""}</span>
      <span class="kalan num">${gr(k)}</span>
      <span class="s">${tl(s.birimFiyatKg)}/kg · %${nf0.format(p)} dolu</span>
      ${kr?`<span class="pill p-kritik">Kritik seviye</span>`:""}</span></button>`;
}
function stokHTML(){
  const q=S.stokQ.trim().toLocaleLowerCase("tr");
  let L=S.stok.slice().sort((a,b)=>(kritikMi(b)-kritikMi(a))||String(a.malzeme).localeCompare(String(b.malzeme),"tr")||String(a.renk).localeCompare(String(b.renk),"tr"));

  const top=S.stok.reduce((a,s)=>a+(+s.kalanGr||0),0);

  <div class="kpis">

    <div class="kpi"><span class="ik">${IK.terazi}</span><div class="l">Toplam stok</div><div class="v">${gr(top)}</div></div>
    <div class="kpi"><span class="ik yesil">${IK.lira}</span><div class="l">Stok değeri</div><div class="v">${tl(deger)}</div></div>
    <div class="kpi"><span class="ik">${IK.kutu}</span><div class="l">Kritik seviyede</div><div class="v ${kritik?"zarar":""}">${nf0.format(kritik)}</div></div></div>
  <input class="search" id="sq" type="search" placeholder="Marka, malzeme veya renk ara" value="${esc(S.stokQ)}" autocomplete="off">
  ${!S.ready.stok?`<div class="empty">Stok yükleniyor…</div>`:
    L.length?`<div class="makaralar">${L.map(makaraKart).join("")}</div>`:
    S.stok.length?`<div class="empty">Aramayla eşleşen malzeme yok.</div>`:
    `<div class="empty"><b>Stok boş</b>Elinizdeki her makarayı (filament) ya da şişeyi (reçine) malzeme, renk ve kalan gramıyla ekleyin. Üretim bitince harcanan gram buradan otomatik düşer.</div>`}`;
}

/* ---------- Alttan açılan sayfalar ---------- */
function sheet(html,onMount){
  layer.innerHTML=`<div class="sheet-wrap" data-act="kapatDis"><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>${html}</div></div>`;
  document.body.style.overflow="hidden";
  const f=layer.querySelector("input,select,textarea");if(f&&matchMedia("(min-width:700px)").matches)f.focus();
  onMount&&onMount(layer.querySelector(".sheet"));
}
function kapat(){layer.innerHTML="";document.body.style.overflow=""}

function stokOptions(sec){
  const L=S.stok.slice().sort((a,b)=>String(a.malzeme).localeCompare(String(b.malzeme),"tr"));
  return `<option value="">Malzeme seçin</option>`+L.map(s=>`<option value="${s.id}" ${s.id===sec?"selected":""}>${esc(s.malzeme)} · ${esc(s.renk||"")}${s.marka?" · "+esc(s.marka):""} — ${gr(s.kalanGr)} kaldı</option>`).join("");
}
function birimListesi(){return [...new Set(S.isler.map(j=>j.birim).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"tr"))}

function isFormu(j){
  const yeni=!j;j=j||{adet:1,durum:"baski"};
  const busy=new Set(S.isler.filter(x=>x.durum==="baski"&&x.id!==j.id).map(x=>x.yazici));
  sheet(`<h3>${yeni?"Yeni üretim":"İşi düzenle"}</h3>
  ${S.stok.length===0?`<div class="ro" style="margin-top:10px">Stokta malzeme yok. Önce Stok sekmesinden makara ekleyin; iş yine de kaydedilir ama gram düşülemez.</div>`:""}
  <form class="form" id="fIs" novalidate>
    <div class="fld"><label for="iAd">İşin adı</label><input id="iAd" required maxlength="120" value="${esc(j.ad||"")}" placeholder="Örn. Rektörlük masa bayrağı"></div>
    <div class="f2">
      <div class="fld"><label for="iAdet">Adet</label><input id="iAdet" inputmode="numeric" value="${esc(j.adet||1)}"></div>
      <div class="fld"><label for="iBirim">Talep eden birim</label><input id="iBirim" list="birimler" maxlength="80" value="${esc(j.birim||"")}" placeholder="Örn. Elektrik Birimi"><datalist id="birimler">${birimListesi().map(b=>`<option value="${esc(b)}">`).join("")}</datalist></div>
    </div>
    <div class="fld"><label for="iYaz">Yazıcı</label><select id="iYaz">${yazicilar().map(p=>`<option ${p===(j.yazici||"")?"selected":""} value="${esc(p)}">${esc(p)}${busy.has(p)?" (baskıda)":""}</option>`).join("")}</select></div>
    <div class="fld"><label for="iStok">Stoktaki malzeme</label><select id="iStok">${stokOptions(j.stokId)}</select></div>
    <div class="f2">
      <div class="fld"><label for="iGr">Tahmini gramaj (g)</label><input id="iGr" inputmode="decimal" value="${esc(j.tahminiGr??"")}" placeholder="Dilimleyiciden"></div>
      <div class="fld"><label for="iSure">Tahmini süre (saat)</label><input id="iSure" inputmode="decimal" value="${esc(j.tahminiSure!=null?String(j.tahminiSure).replace(".",","):"")}" placeholder="Örn. 3,5"></div>
    </div>
    <div class="fld"><label for="iPiy">Piyasa birim fiyatı (₺, isteğe bağlı)</label><input id="iPiy" inputmode="decimal" value="${esc(j.piyasaBirim!=null?String(j.piyasaBirim).replace(".",","):"")}" placeholder="Hazır alınsaydı 1 adedi kaça olurdu"><span class="hint">Girilirse tasarruf otomatik hesaplanır.</span></div>
    ${yeni?`<div class="fld"><label>Durum</label><div class="seg" role="group"><button type="button" data-v="baski" aria-pressed="true" class="dsec">Hemen başlat</button><button type="button" data-v="sira" aria-pressed="false" class="dsec">Sıraya ekle</button></div></div>`:""}
    <div class="fld"><label for="iNot">Not</label><textarea id="iNot" maxlength="1000" placeholder="Dilimleme ayarı, dolgu, renk değişimi…">${esc(j.not||"")}</textarea></div>
    <div class="err" id="iErr" role="alert"></div>
    <div class="actions"><button type="button" class="btn" data-act="kapat">Vazgeç</button><button class="btn pri" id="iKaydet">${yeni?"Kaydet":"Değişiklikleri kaydet"}</button></div>
  </form>`,el=>{
    let durum=j.durum;
    el.querySelectorAll(".dsec").forEach(b=>b.onclick=()=>{durum=b.dataset.v;el.querySelectorAll(".dsec").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    el.querySelector("#fIs").onsubmit=async e=>{
      e.preventDefault();
      const ad=el.querySelector("#iAd").value.trim();const err=el.querySelector("#iErr");
      if(!ad){err.textContent="İşin adını yazın.";return}
      const adet=Math.max(1,Math.round(numIn(el.querySelector("#iAdet").value)||1));
      const stokId=el.querySelector("#iStok").value||null;
      const s=stokBul(stokId);
      const veri={ad,adet,birim:el.querySelector("#iBirim").value.trim(),yazici:el.querySelector("#iYaz").value,stokId,

          await S.db.collection("isler").doc().set(veri);
          toast(durum==="baski"?"Baskı başlatıldı":"Sıraya eklendi");
        }else{
          await S.db.doc("isler/"+j.id).update(veri);toast("Kaydedildi");
        }
        kapat();
      }catch(x){btn.disabled=false;err.textContent=hataMetni(x)}
    };
  });
}

function bitirFormu(id,sonuc){

  sheet(`<h3>${sonuc==="tamam"?"Üretimi tamamla":"Hatalı baskı"}</h3>
  <p style="color:var(--muted);margin:6px 0 0">${esc(j.ad)}${s?` — ${esc(stokAd(s))} stoğundan düşülecek (${gr(s.kalanGr)} var)`:""}</p>
  <form class="form" id="fBit" novalidate>
    <div class="fld"><label for="bGr">${sonuc==="tamam"?"Gerçek gramaj (g)":"Harcanan gramaj (g)"}</label><input id="bGr" inputmode="decimal" value="${esc(j.tahminiGr??"")}" required><span class="hint">Destekler ve atık dahil, stoktan düşülecek toplam.</span></div>
    ${S.assets?`<div class="fld"><label>Fotoğraf</label><label class="filelbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Ürünün fotoğrafını çek veya seç</span><input type="file" id="bFoto" accept="image/*" capture="environment" multiple hidden></label><div class="prev" id="bPrev"></div></div>`:""}
    <div class="fld"><label for="bNot">Not</label><textarea id="bNot" maxlength="1000" placeholder="${sonuc==="tamam"?"Teslim edilen kişi, montaj notu…":"Hatanın nedeni: tabla tutmadı, filament koptu…"}">${esc(j.not||"")}</textarea></div>
    <div class="err" id="bErr" role="alert"></div>

  </form>`,el=>{
    let secilen=[];

    if(bf)bf.onchange=()=>{secilen=[...bf.files];const p=el.querySelector("#bPrev");p.innerHTML="";secilen.forEach(f=>{const i=document.createElement("img");i.src=URL.createObjectURL(f);i.alt="";p.appendChild(i)})};
    el.querySelector("#fBit").onsubmit=async e=>{e.preventDefault();

      const btn=el.querySelector("#bKaydet");btn.disabled=true;btn.textContent="Kaydediliyor…";
      try{
        const ids=secilen.length?await fotoYukle(secilen):[];
        const g2=S.isler.find(x=>x.id===id)||j;

      }catch(x){btn.disabled=false;btn.textContent="Tekrar dene";err.textContent=hataMetni(x)}
    };
  });
}

  sheet(`<div class="row" style="gap:12px"><span class="swatch" style="background:${esc(s.renkHex||"#888")};width:44px;height:44px"></span>

function ayarFormu(){
  /* Her satır: eski ad (iş kayıtlarını güncellemek için) + yeni ad */
  let L=yazicilar().map(a=>({eski:a,ad:a}));
  sheet(`<h3>Yazıcılar</h3><p style="color:var(--muted);margin:6px 0 0">Yazıcı ekleyin, adını değiştirin ya da çıkarın. Ad değişince o yazıcıdaki iş kayıtları da yeni adla güncellenir.</p>
  <div class="form"><div class="list" id="yzList"></div>
    <div class="fld"><label for="yzYeni">Yeni yazıcı</label>
      <div class="row" style="flex-wrap:nowrap"><input id="yzYeni" maxlength="60" placeholder="Örn. Bambu Lab P1S" style="flex:1"><button type="button" class="btn" id="yzEkle">Ekle</button></div></div>
    <div class="err" id="aErr" role="alert"></div>
    <div class="actions"><button type="button" class="btn" data-act="kapat">Vazgeç</button><button type="button" class="btn pri" id="yzKaydet">Kaydet</button></div></div>`,el=>{
    const liste=el.querySelector("#yzList"),err=el.querySelector("#aErr");
    const aktifte=ad=>S.isler.some(j=>j.durum==="baski"&&j.yazici===ad);
    const isSay=ad=>S.isler.filter(j=>j.yazici===ad).length;
    function ciz(){
      liste.innerHTML=L.length?L.map((y,i)=>`<div class="item" style="cursor:default;gap:8px">
        <input aria-label="Yazıcı adı" data-i="${i}" value="${esc(y.ad)}" maxlength="60" style="flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)">
        <button type="button" class="btn danger sm" data-sil="${i}" ${y.eski&&aktifte(y.eski)?"disabled title=\"Bu yazıcıda baskı sürüyor\"":""}>Çıkar</button></div>
        ${y.eski&&aktifte(y.eski)?`<div style="padding:0 14px 10px;font-size:12px;color:var(--muted)">Baskı sürerken çıkarılamaz.</div>`:""}`).join("")
        :`<div class="empty" style="border:0">Liste boş. En az bir yazıcı ekleyin.</div>`;
      liste.querySelectorAll("input[data-i]").forEach(inp=>inp.oninput=()=>{L[+inp.dataset.i].ad=inp.value});
      liste.querySelectorAll("[data-sil]").forEach(b=>b.onclick=()=>{const y=L[+b.dataset.sil];
        const n=y.eski?isSay(y.eski):0;
        if(n&&b.dataset.onay!=="1"){b.dataset.onay="1";b.textContent="Emin misiniz?";err.textContent=`"${y.eski}" ile kayıtlı ${n} iş var; kayıtlar silinmez, eski adla kalır.`;return}
        L.splice(+b.dataset.sil,1);err.textContent="";ciz()});
    }
    ciz();
    const ekle=()=>{const inp=el.querySelector("#yzYeni");const v=inp.value.trim();if(!v)return;
      if(L.some(y=>y.ad.trim().toLocaleLowerCase("tr")===v.toLocaleLowerCase("tr"))){err.textContent="Bu adla bir yazıcı zaten var.";return}
      L.push({eski:null,ad:v});inp.value="";err.textContent="";ciz()};
    el.querySelector("#yzEkle").onclick=ekle;
    el.querySelector("#yzYeni").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();ekle()}};
    el.querySelector("#yzKaydet").onclick=async()=>{
      const temiz=L.map(y=>({eski:y.eski,ad:y.ad.trim()})).filter(y=>y.ad);
      if(!temiz.length){err.textContent="En az bir yazıcı olmalı.";return}
      const adlar=temiz.map(y=>y.ad.toLocaleLowerCase("tr"));
      if(new Set(adlar).size!==adlar.length){err.textContent="Aynı adı iki yazıcıya veremezsiniz.";return}
      const btn=el.querySelector("#yzKaydet");btn.disabled=true;btn.textContent="Kaydediliyor…";
      try{
        await S.db.doc("ayar/genel").set(Object.assign({},S.ayar||{},{yazicilar:temiz.map(y=>y.ad)}));
        for(const y of temiz){if(y.eski&&y.eski!==y.ad){
          for(const j of S.isler.filter(j=>j.yazici===y.eski)){await S.db.doc("isler/"+j.id).update({yazici:y.ad})}}}
        kapat();toast("Yazıcı listesi kaydedildi");
      }catch(x){btn.disabled=false;btn.textContent="Kaydet";err.textContent=hataMetni(x)}
    };
  });
}

async function bambuYukle(){try{S.bambu=await API("GET","/api/bambu")}catch(e){}return S.bambu}

function bambuListe(){
  const B=S.bambu||{bulunan:[],yazicilar:[]},kayit=B.yazicilar||[],M={};
  kayit.forEach(k=>M[k.seri]={seri:k.seri,model:k.model,kayit:k});

    const durum=!k?`<span class="pill p-sira">Bağlanmadı</span>`:k.bagli?`<span class="pill p-baski">Bağlı${k.durum?" · "+(BAMBU_DURUM[k.durum]||k.durum):""}</span>`:`<span class="pill p-hata">Bağlantı yok</span>`;

      <div class="s num" style="font-size:12px;color:var(--muted)">${esc(x.seri)}${x.ip?" · "+esc(x.ip):""}</div>${k&&k.hata?`<div style="font-size:12px;color:var(--bad);margin-top:2px">${esc(k.hata)}</div>`:""}</div>
      <div class="row" style="gap:6px">${durum}<button class="btn sm" data-bseri="${esc(x.seri)}">${k?"Düzenle":"Bağla"}</button></div></div><div data-bform="${esc(x.seri)}"></div></div>`}).join("")}</div>`;
}

let _yoklama=null;
function girisGoster(kurulum,tusTakimi){
  S.ben=null;S.stok=[];S.isler=[];S.ready={stok:false,isler:false};S.surum=undefined;
  kapat();document.body.classList.add("kilitli");
  if(kurulum){vitrinKapat();return kurulumEkrani()}
  /* Giriş yok: sistem herkese açık. Pi ekranı boştayken stok panosu (vitrin) görünür.
     Tuş takımı yalnızca yönetici girişi için açılır. */
  if(!tusTakimi)return misafirAc();
  vitrinKapat();
  let asama="tel",tel="",pin="",mesgul=false;
  const ciz=(hata)=>{
    const telOk=/^5\d{9}$/.test(tel), pinOk=/^\d{4,8}$/.test(pin);
    app.innerHTML=`<div class="giris">
      <aside class="giris-tanitim">${KEMER}${DALGA}<img class="glogo" src="/logo" alt="" onerror="this.hidden=true">
        <h1>3D Üretim Takip</h1><p class="alt">Yapı İşleri ve Teknik Daire Başkanlığı · AR-GE Birimi</p>
        <ul><li>${IK.onay}Filament ve reçine stoğu</li><li>${IK.onay}Yazıcı ve üretim kaydı</li><li>${IK.onay}Maliyet ve tasarruf raporu</li></ul></aside>
      <div class="giris-kutu"><h2>Yönetici girişi</h2><p class="giris-not">Kişi ekleme, logo, Wi-Fi ve güncelleme için. Stok ve üretim için giriş gerekmez.</p>
      <div class="ekran ${asama==="tel"?"etkin":""} ${tel?"":"bos"}" id="gTel" role="button" tabindex="0">${tel?esc(telGoster(tel)):"Cep telefonu numaranız"}</div>
      ${asama==="pin"?`<div class="ekran etkin ${pin?"":"bos"}">${pin?"●".repeat(pin.length):"PIN'iniz"}</div>`:""}
      <div class="err" role="alert">${hata?esc(hata):""}</div>
      <div class="tus">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-t="${n}">${n}</button>`).join("")}
        <button class="geri" data-t="sil" aria-label="Sil">⌫</button><button data-t="0">0</button>
        <button class="ok" data-t="ok" ${(asama==="tel"?telOk:pinOk)&&!mesgul?"":"disabled"}>${asama==="tel"?"Devam":"Giriş"}</button></div>
      ${asama==="pin"?`<button class="link" data-t="numara">Numarayı değiştir</button>`:""}
      <button class="btn sm vitrine" data-t="vitrin">← Vazgeç</button>
    </div></div>`;
  };
  const bas=async t=>{
    if(mesgul)return;
    if(t==="vitrin")return misafirAc();
    if(t==="numara"){asama="tel";pin="";return ciz()}
    if(t==="sil"){if(asama==="tel")tel=tel.slice(0,-1);else pin=pin.slice(0,-1);return ciz()}
    if(t==="ok"){
      if(asama==="tel"){if(/^5\d{9}$/.test(tel)){asama="pin";ciz()}return}
      if(!/^\d{4,8}$/.test(pin))return;
      mesgul=true;ciz();
      try{const r=await API("POST","/api/giris",{telefon:tel,pin});mesgul=false;girisYapildi(r.ben)}
      catch(x){mesgul=false;pin="";
        ciz(x.code==="kilitli"?`Çok fazla hatalı deneme. ${Math.ceil((x.saniye||300)/60)} dakika sonra tekrar deneyin.`:
            x.code==="pin"?"Numara ya da PIN hatalı.":hataMetni(x))}
      return}
    if(/^\d$/.test(t)){
      if(asama==="tel"){if(!tel&&t==="0")return;if(tel.length<10)tel+=t}
      else if(pin.length<8)pin+=t;
      ciz()}
  };
  app.onclick=e=>{const b=e.target.closest("[data-t]");if(b&&!S.ben)bas(b.dataset.t);const g=e.target.closest("#gTel");if(g&&!S.ben&&asama==="pin"){asama="tel";pin="";ciz()}};
  girisKlavye=e=>{if(S.ben||layer.innerHTML)return;
    if(/^\d$/.test(e.key))bas(e.key);else if(e.key==="Backspace")bas("sil");else if(e.key==="Enter")bas("ok")};
  ciz();
}
let girisKlavye=null;
document.addEventListener("keydown",e=>{if(girisKlavye)girisKlavye(e)});

  app.querySelector("#kDosya").onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{const veri=JSON.parse(await f.text());const r=await API("POST","/api/kurulum-dosya",veri);
      toast(r.eklenen+" kişi yüklendi");girisGoster(false)}
    catch(x){err.textContent=x instanceof SyntaxError?"Dosya okunamadı; doğru kisiler.json dosyasını seçin.":x.code==="kurulum_yapilmis"?"Kurulum zaten yapılmış.":"Dosya yüklenemedi: içeriği geçersiz."}};
  app.querySelector("#fKur").onsubmit=async e=>{e.preventDefault();
    const ad=app.querySelector("#kAd").value.trim(),telefon=app.querySelector("#kTel").value,pin=app.querySelector("#kPin").value;
    if(!ad){err.textContent="Ad soyad yazın.";return}
    if(!/^\d{4,8}$/.test(pin)){err.textContent="PIN 4-8 rakam olmalı.";return}
    if(pin!==app.querySelector("#kPin2").value){err.textContent="İki PIN aynı değil.";return}
    try{const r=await API("POST","/api/kurulum",{ad,telefon,pin});girisYapildi(r.ben)}
    catch(x){err.textContent=x.code==="gecersiz_veri"?"Telefon numarasını 05xx xxx xx xx biçiminde yazın.":hataMetni(x)}};
}

function misafirAc(){
  girisYapildi({id:"",ad:"Ortak kullanım",rol:"misafir"},true);
}
function girisYapildi(ben,misafir){
  vitrinKapat();
  S.misafir=!!misafir;if(!misafir)S.kimlik=null;
  S.ben=ben;S.canWrite=ben.rol!=="izleyici";girisKlavye=null;app.onclick=null;
  document.body.classList.remove("kilitli");S.tab="panel";
  app.innerHTML=`<div class="empty">Kayıtlar yükleniyor…</div>`;
  setSync(true,"Bağlı · "+kisiAd());
  yenile();sistemYukle().then(()=>{if(PI_EKRANI)render()});bambuYukle().then(()=>render());
  if(PI_EKRANI)ekranAcikTut();
  if(!PI_EKRANI&&!misafir)API("POST","/api/saat",{ms:Date.now()}).catch(()=>{});
  if(!_yoklama)_yoklama=setInterval(()=>{if(!document.hidden&&S.ben)denetle()},3000);
  sonEtkilesim=Date.now();
}
async function cikis(){try{await API("POST","/api/cikis",{})}catch(e){}S.kimlik=null;girisGoster(false)}
/* Durum çubuğunda görünen ad: yönetici oturumu > doğrulanmış kimlik > ortak */
const kisiAd=()=>S.misafir?(kimlikGecerli()?S.kimlik.ad.split(" ")[0]:"Ortak"):(S.ben?S.ben.ad.split(" ")[0]:"");

/* Pi ekranı ortak kullanıldığı için 5 dakika dokunulmazsa kilitlenir */
let sonEtkilesim=Date.now();
["pointerdown","keydown","touchstart"].forEach(t=>document.addEventListener(t,()=>{sonEtkilesim=Date.now()},{passive:true}));
if(PI_EKRANI)setInterval(()=>{
  const bos=Date.now()-sonEtkilesim;
  /* Pi ekranı hep uygulamada kalır. 5 dk dokunulmazsa: yönetici çıkar, kimlik unutulur, açık pencere kapanır, panele dönülür */
  if(S.ben&&bos>5*60*1000){
    if(!S.misafir){cikis();toast("Yönetici oturumu kapandı")}
    else if(S.kimlik||layer.innerHTML||S.tab!=="panel"){S.kimlik=null;kapat();S.tab="panel";setSync(true,"Bağlı · Ortak");render()}}
  /* Yönetici tuş takımı açık bırakılırsa 1 dakika sonra uygulamaya dön */
  else if(!S.ben&&document.querySelector(".tus")&&bos>60*1000)misafirAc();
},10000);

/* ---------- Vitrin (Pi ekranı stok panosu) ---------- */
const _vt={acik:false,veri:null,surum:null,yokla:null,saat:null,kaydir:null,kilit:null,son:0};
function vitrinKapat(){
  if(!_vt.acik)return;
  _vt.acik=false;clearInterval(_vt.yokla);clearInterval(_vt.saat);clearInterval(_vt.kaydir);
  document.body.classList.remove("vitrin");delete document.documentElement.dataset.theme;
  try{_vt.kilit&&_vt.kilit.release()}catch(e){}_vt.kilit=null;
}
async function ekranAcikTut(){
  try{if(navigator.wakeLock&&!_vt.kilit){_vt.kilit=await navigator.wakeLock.request("screen");_vt.kilit.addEventListener("release",()=>{_vt.kilit=null})}}catch(e){}
}
function vitrinGoster(){
  girisKlavye=null;kapat();
  document.body.classList.add("kilitli","vitrin");
  document.documentElement.dataset.theme="dark";
  _vt.acik=true;_vt.surum=null;
  app.onclick=e=>{if(e.target.closest("[data-vt=giris]")){sonEtkilesim=Date.now();misafirAc()}};
  app.innerHTML=`<div class="vt-bos">Stok panosu yükleniyor…</div>`;
  clearInterval(_vt.yokla);clearInterval(_vt.saat);
  const yukle=async()=>{
    try{const v=await API("GET","/api/vitrin");uygDenetle(v.uyg);
      if(!_vt.acik)return;
      /* Kayıt değiştiyse ya da dakikada bir (ilerleme çubukları için) yeniden çiz */
      if(v.surum!==_vt.surum||Date.now()-_vt.son>60000){_vt.veri=v;_vt.surum=v.surum;_vt.son=Date.now();vitrinCiz()}
    }catch(e){if(_vt.acik&&!_vt.veri)app.innerHTML=`<div class="vt-bos"><b>Sunucuya ulaşılamıyor</b><br>Yeniden deneniyor…</div>`}
  };
  yukle();_vt.yokla=setInterval(yukle,5000);
  _vt.saat=setInterval(vitrinSaat,1000);
  ekranAcikTut();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&_vt.acik)ekranAcikTut()});
function vitrinSaat(){
  const e=document.getElementById("vtSaat");if(!e)return;const d=new Date();
  e.innerHTML=`<b>${d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</b><span>${d.toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"})}</span>`;
}
function vitrinCiz(){
  const v=_vt.veri;if(!v)return;
  const kritikMi2=x=>(+x.kalanGr||0)<=(+x.kritikGr||200);
  const L=v.stok.slice().sort((a,b)=>String(a.malzeme).localeCompare(String(b.malzeme),"tr")||String(a.renk||"").localeCompare(String(b.renk||""),"tr"));
  const top=L.reduce((a,x)=>a+(+x.kalanGr||0),0),kr=L.filter(kritikMi2).length;
  const yz=(v.yazicilar&&v.yazicilar.length?v.yazicilar:VARSAYILAN_YAZICILAR).map(p=>{
    const j=v.aktif.find(x=>x.yazici===p);let d="Boşta";
    if(j){d=esc(j.ad);if(j.baslangic&&j.tahminiSure){const kal=j.tahminiSure*3600000-(Date.now()-j.baslangic);d+=kal>60000?` · ${sure(kal/3600000)} kaldı`:" · süre doldu"}}
    return `<div class="vt-prn ${j?"busy":""}"><div class="n">${esc(p)}</div><div class="d"><i></i>${j?d:"Boşta"}</div></div>`}).join("");
  const kart=x=>{const k=+x.kalanGr||0,b=Math.max(+x.baslangicGr||1000,k,1),p=Math.max(0,Math.min(100,k/b*100)),kri=kritikMi2(x);
    const renk=kri?"var(--bad)":p<40?"var(--warn)":"var(--ok)";
    return `<div class="vt-mak ${kri?"kritik":""}"><span class="halka" style="--p:${p.toFixed(1)};--c:${renk}"><span class="ic" style="background:${esc(x.renkHex||"#888888")}"></span></span>
      <div style="min-width:0"><div class="t">${esc(x.malzeme)} · ${esc(x.renk||"Renk yok")}</div><div class="s">${esc(x.marka||"")}${x.cap?" · "+esc(x.cap):""}</div>
      <div class="k">${gr(k)}${kri?`<span class="pill p-kritik">Kritik</span>`:""}</div></div></div>`};
  app.innerHTML=`<div class="vt">
    <div class="vt-ust"><img src="/logo" alt="" onerror="this.hidden=true"><div class="vt-ad"><b>3D Üretim · Stok Panosu</b><span>Yapı İşleri ve Teknik Daire Başkanlığı · AR-GE Birimi</span></div><div class="vt-saat" id="vtSaat"></div></div>
    <div class="vt-yazicilar">${yz}</div>
    <div class="vt-stok" id="vtStok">${L.length?L.map(kart).join(""):`<div class="vt-bos">Stokta kayıtlı malzeme yok. Sistemi açıp Stok bölümünden ekleyin.</div>`}</div>
    <aside class="vt-yan">
      <div class="vt-ozet"><div><b>${L.length}</b><span>makara</span></div><div><b>${top>=1000?nf1.format(top/1000):nf0.format(top)}</b><span>${top>=1000?"kg":"g"} stok</span></div><div class="${kr?"kr":""}"><b>${kr}</b><span>kritik</span></div></div>
      <div class="vt-kutu"><div class="qr"><img src="/qr.svg?t=adres" alt="Adres karekodu"></div><b>Telefondan aç</b><span class="num">${esc((v.adres||"").replace(/^https?:\/\//,""))}</span></div>
      <button class="btn pri vt-giris" data-vt="giris">Sistemi aç</button>
    </aside></div>`;
  vitrinSaat();vitrinKaydir();
}
/* Makara sayısı ekrana sığmazsa liste yavaşça kayar, sonda bekleyip başa döner */
function vitrinKaydir(){
  clearInterval(_vt.kaydir);
  const el=document.getElementById("vtStok");if(!el||el.scrollHeight<=el.clientHeight+4)return;
  let bekle=80;
  _vt.kaydir=setInterval(()=>{
    if(bekle>0){bekle--;return}
    if(el.scrollTop+el.clientHeight>=el.scrollHeight-1){bekle=80;setTimeout(()=>{el.scrollTop=0},3000);return}
    el.scrollTop+=1;
  },50);
}

function silOnay(alan,metin,fn){
  const a=layer.querySelector("#silAlan");if(!a)return;
  a.innerHTML=`<div class="confirm"><div>${metin}</div><div class="actions"><button class="btn sm" data-act="silIptal">Vazgeç</button><button class="btn danger sm" id="silEvet">Evet, sil</button></div></div>`;
  a.querySelector("#silEvet").onclick=async()=>{try{await fn();kapat()}catch(x){toast(hataMetni(x))}};
}

/* ---------- Fotoğraf ---------- */
async function kucult(file){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
    const m=1600,sc=Math.min(1,m/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.82));
  }catch(e){return file}
}
async function fotoYukle(files){
  if(!S.assets){toast("Fotoğraf yükleme bu görünümde açık değil");return []}
  const ids=[];
  for(const f of files){
    try{const b=await kucult(f);const r=await S.assets.upload(b,{type:b.type&&/^image\/(jpeg|png|webp|gif)$/.test(b.type)?b.type:"image/jpeg"});ids.push(r.id)}
    catch(x){toast(x&&x.code==="too_large"?"Fotoğraf çok büyük":x&&x.code==="quota_or_state"?"Fotoğraf depolama alanı dolu":"Bir fotoğraf yüklenemedi")}
  }
  return ids;
}

/* ---------- Dışa aktarma ---------- */
async function csv(){
  const bas=donemBaslangic().getTime();
  const L=S.isler.filter(j=>(j.durum==="tamam"||j.durum==="hata")&&(j.bitis||0)>=bas).sort((a,b)=>a.bitis-b.bitis);
  if(!L.length){toast("Bu dönemde biten iş yok");return}
  const c=v=>{const s=String(v==null?"":v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const n=v=>nf2.format(+v||0);
  const rows=[["Bitiş tarihi","İş","Adet","Talep eden birim","Yazıcı","Malzeme","Renk","Marka","Gramaj (g)","Süre (saat)","Malzeme maliyeti (TL)","Piyasa değeri (TL)","Tasarruf (TL)","Durum","Not"]];
  L.forEach(j=>{const s=stokBul(j.stokId)||{};rows.push([tarih(j.bitis),j.ad,j.adet||1,j.birim||"",j.yazici||"",s.malzeme||"",s.renk||"",s.marka||"",
    nf1.format(+j.gercekGr||0),j.baslangic&&j.bitis?nf1.format((j.bitis-j.baslangic)/3600000):"",n(maliyetHesap(j)),j.piyasaBirim?n(piyasa(j)):"",j.durum==="tamam"&&j.piyasaBirim?n(tasarruf(j)):"",DURUMLAR[j.durum],j.not||""])});
  const metin="﻿"+rows.map(r=>r.map(c).join(";")).join("\r\n");
  const ad="3D-uretim-"+donemAd().replace(/\s+/g,"-").replace(/[^\wçğıöşüÇĞİÖŞÜ.-]/g,"")+".csv";
  if(!S.downloads){toast("Dosya indirme bu görünümde açık değil");return}
  try{await S.downloads.save({filename:ad,data:new Blob([metin],{type:"text/csv"})})}catch(x){if(!(x&&/declin|cancel/i.test(x.code||"")))toast("Dosya kaydedilmedi")}
}

/* ---------- Yardımcılar ---------- */
let _uid;async function uid(){if(_uid!==undefined)return _uid;try{_uid=S.user?await S.user.id():null}catch(e){_uid=null}return _uid}
async function adlariCoz(root){
  root=root||document;const els=[...root.querySelectorAll("[data-uid]")];if(!els.length||!S.user||!S.user.profiles)return;
  try{const ids=[...new Set(els.map(e=>e.dataset.uid))];const ps=await S.user.profiles(ids);els.forEach(e=>{const p=ps&&ps[e.dataset.uid];e.textContent=(p&&p.name)||"Bir kullanıcı"})}catch(e){}
}
function hataMetni(x){const c=x&&x.code;
  if(c==="ag")return "Pi'ye ulaşılamadı. Telefonun Pi'nin Wi-Fi ağına bağlı olduğunu kontrol edip tekrar deneyin.";
  if(c==="belge_yok")return "Bu kayıt başka bir cihazdan silinmiş.";
  if(c==="cok_buyuk")return "Dosya çok büyük.";
  if(c==="iptal")return "Değişiklik kaydedilmedi: numara girilmedi.";
  if(c==="yetki")return "Bu işlem için yetkiniz yok.";
  return "İşlem tamamlanamadı, tekrar deneyin.";}

/* ---------- Olaylar ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();scrollTo(0,0);return}
  const a=t.dataset.act,id=t.dataset.id;
  if(a==="kapatDis"){if(e.target===t)kapat();return}
  if(a==="kapat")return kapat();
  if(a==="donem"){S.donem=t.dataset.v;return render()}
  if(a==="filtre"){S.filtre=t.dataset.v;return render()}
  if(a==="tumIsler"){S.tab="uretim";S.filtre="biten";render();scrollTo(0,0);return}
  if(a==="is")return isDetay(id);
  if(a==="isDuzenle")return isFormu(S.isler.find(x=>x.id===id));
  if(a==="isBaslat"){try{await S.db.doc("isler/"+id).update({durum:"baski",baslangic:Date.now()});toast("Baskı başladı");kapat()}catch(x){toast(hataMetni(x))}return}
  if(a==="isBitir")return bitirFormu(id,t.dataset.v);
  if(a==="isGeriAl"){const j=S.isler.find(x=>x.id===id);if(!j)return;
    try{await stokDegis(j.stokId,+j.stokDusulenGr||0);await S.db.doc("isler/"+id).update({durum:"baski",bitis:null,stokDusulenGr:0});toast("Baskıya geri alındı, gram stoğa iade edildi");kapat()}catch(x){toast(hataMetni(x))}return}
  if(a==="isSil"){const j=S.isler.find(x=>x.id===id);if(!j)return;
    silOnay(null,`<b>${esc(j.ad)}</b> silinsin mi?${(+j.stokDusulenGr||0)>0?` Stoktan düşülen ${gr(j.stokDusulenGr)} malzemeye geri eklenecek.`:""}`,async()=>{
      await stokDegis(j.stokId,+j.stokDusulenGr||0);await S.db.doc("isler/"+id).delete();
      for(const f of (j.fotolar||[])){try{await S.assets&&S.assets.delete(f)}catch(e){}}toast("İş silindi")});return}
  if(a==="silIptal"){const s=layer.querySelector("#silAlan");if(s)s.innerHTML="";return}
  if(a==="buyut"){const lb=document.createElement("div");lb.className="lightbox";lb.innerHTML=`<img src="${esc(t.dataset.src)}" alt="">`;lb.onclick=()=>lb.remove();document.body.appendChild(lb);return}
  if(a==="stok")return stokDetay(id);
  if(a==="stokYeni")return stokFormu();
  if(a==="stokDuz")return stokFormu(stokBul(id));
  if(a==="stokSil"){const s=stokBul(id);if(!s)return;const kul=S.isler.some(j=>j.stokId===id);
    silOnay(null,`<b>${esc(stokAd(s))}</b> stoktan silinsin mi?${kul?" Bu malzemeyle yapılmış işlerin kayıtları kalır, malzeme adı “Silinmiş malzeme” görünür.":""}`,async()=>{await S.db.doc("stok/"+id).delete();toast("Malzeme silindi")});return}
  if(a==="ekle"){try{await stokDegis(id,+t.dataset.v);toast(gr(+t.dataset.v)+" eklendi");stokDetay(id)}catch(x){toast(hataMetni(x))}return}
  if(a==="ayar"){if(yonetici())ayarFormu();return}
  if(a==="sistem")return sistemFormu();
  if(a==="csv")return csv();
});
$("#fab").onclick=()=>{if(S.canWrite&&S.db)isFormu()};
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;render()}
  if(e.target.id==="sq"){S.stokQ=e.target.value;render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const lb=document.querySelector(".lightbox");if(lb)lb.remove();else if(layer.innerHTML)kapat()}});

/* ---------- Başlatma ---------- */
S.db=DB;S.assets=ASSETS;S.downloads=DOWNLOADS;S.user=null;S.canWrite=false;
let _yenileniyor=false;
/* Güncelleme sonrası açık ekran eski sayfada kalmasın: arayüz dosyası değişince sayfayı yenile */
let _uyg=null;
function uygDenetle(u){if(!u)return;if(_uyg===null){_uyg=u;return}if(u!==_uyg&&!layer.innerHTML&&!document.querySelector(".kimlik-katman"))location.reload()}
async function yenile(){
  if(_yenileniyor)return;_yenileniyor=true;
  try{const h=await API("GET","/api/hepsi");
    S.stok=h.stok||[];S.isler=h.isler||[];S.ayar=h.ayar||null;S.surum=h.surum;S.ready.stok=S.ready.isler=true;
    if(S.ben)setSync(true,"Bağlı · "+kisiAd());render();
  }catch(e){if(e.code==="ag")setSync(false,"Pi'ye ulaşılamıyor")}
  finally{_yenileniyor=false}
}
async function denetle(){
  try{const r=await API("GET","/api/surum");uygDenetle(r.uyg);if(S.ben)setSync(true,"Bağlı · "+kisiAd());if(r.surum!==S.surum)yenile()}
  catch(e){if(e.code==="ag")setSync(false,"Pi'ye ulaşılamıyor")}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.ben)denetle()});
/* Baskı ilerleme çubukları dakikada bir güncellensin */
setInterval(()=>{if(S.ben&&S.tab==="panel"&&!layer.innerHTML&&!document.hidden)render()},60000);
(async function baslat(){
  document.body.classList.add("kilitli");
  app.innerHTML=`<div class="empty">Pi'ye bağlanılıyor…</div>`;
  for(let i=0;i<20;i++){
    try{const o=await API("GET","/api/oturum");if(o.giris)girisYapildi(o.ben);else girisGoster(o.kurulumGerekli);return}
    catch(e){app.innerHTML=`<div class="empty"><b>Pi'ye ulaşılamıyor</b>Telefonun Pi'nin Wi-Fi ağına bağlı olduğunu kontrol edin. Yeniden deneniyor…</div>`;await new Promise(r=>setTimeout(r,3000))}
  }
})();
})();
